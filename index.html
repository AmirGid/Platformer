<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12141c">
<title>Demonic Flame</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    --ink:#1b1f2a;
    --paper:#f2ede1;
    --paper-raised:#ffffff;
    --paper-border:#d9d0ba;
    --muted:#6b6455;
    --accent:#e8543e;
    --accent-ink:#ffffff;
    --grass:#3aa66b;
    --sky-bezel:#12141c;
    --key-bg:#ffffff;
    --key-border:#c9bfa4;
    --key-shadow:#c9bfa4;
    --shadow-soft: 0 10px 30px rgba(27,31,42,0.12);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#f0ece0;
      --paper:#14151c;
      --paper-raised:#1d1f29;
      --paper-border:#33364a;
      --muted:#9490a0;
      --accent:#ff7a5c;
      --accent-ink:#1a0e0a;
      --grass:#4fc785;
      --sky-bezel:#05060a;
      --key-bg:#242634;
      --key-border:#3d3f56;
      --key-shadow:#0b0c14;
      --shadow-soft: 0 10px 30px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --ink:#f0ece0;
    --paper:#14151c;
    --paper-raised:#1d1f29;
    --paper-border:#33364a;
    --muted:#9490a0;
    --accent:#ff7a5c;
    --accent-ink:#1a0e0a;
    --grass:#4fc785;
    --sky-bezel:#05060a;
    --key-bg:#242634;
    --key-border:#3d3f56;
    --key-shadow:#0b0c14;
    --shadow-soft: 0 10px 30px rgba(0,0,0,0.45);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    display:flex;
    justify-content:center;
    padding:32px 16px 48px;
  }
  .wrap{
    width:100%;
    max-width:1040px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }
  .masthead{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    text-align:center;
  }
  h1{
    font-family:"Press Start 2P", "IBM Plex Mono", monospace;
    font-size:clamp(20px,3.4vw,32px);
    line-height:1.4;
    margin:0;
    color:var(--ink);
    text-wrap:balance;
    letter-spacing:1px;
  }
  h1 .accent{ color:var(--accent); }
  .tagline{
    margin:0;
    color:var(--muted);
    font-size:14px;
    max-width:52ch;
  }

  .cabinet{
    position:relative;
    background:var(--sky-bezel);
    padding:14px;
    border-radius:22px;
    box-shadow:var(--shadow-soft);
    width:100%;
    max-width:984px;
  }
  .cabinet::before{
    content:"";
    position:absolute;
    inset:6px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,0.06);
    pointer-events:none;
  }
  .stage{
    position:relative;
    width:100%;
    aspect-ratio:960/540;
    border-radius:10px;
    overflow:hidden;
    background:#7ec8e3;
  }
  #game{
    display:block;
    width:100%;
    height:100%;
  }

  .overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(ellipse at center, rgba(40,12,6,0.6), rgba(5,3,4,0.9));
    backdrop-filter:blur(2px);
  }
  .overlay[hidden]{ display:none; }
  .panel{
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(circle at 18% 12%, rgba(255,120,40,0.16), transparent 40%),
      radial-gradient(circle at 85% 88%, rgba(255,80,20,0.14), transparent 45%),
      linear-gradient(180deg, #1c0f09 0%, #120906 55%, #0a0504 100%);
    border:1px solid #3d1a0c;
    border-radius:14px;
    padding:28px 32px;
    max-width:420px;
    width:min(88%,420px);
    text-align:center;
    box-shadow:0 14px 44px rgba(0,0,0,0.65), 0 0 46px rgba(255,90,30,0.16), inset 0 0 30px rgba(0,0,0,0.5);
  }
  .panel::before{
    content:"";
    position:absolute;
    inset:-20%;
    background:
      radial-gradient(circle at 20% 25%, rgba(255,150,50,0.4), transparent 22%),
      radial-gradient(circle at 82% 18%, rgba(255,90,20,0.32), transparent 24%),
      radial-gradient(circle at 65% 82%, rgba(255,170,60,0.34), transparent 22%),
      radial-gradient(circle at 22% 85%, rgba(255,100,30,0.3), transparent 20%);
    filter:blur(6px);
    opacity:0.55;
    animation:lavaGlow 6s ease-in-out infinite;
    pointer-events:none;
  }
  .panel::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height:5px;
    background:linear-gradient(90deg,#2a0a02,#ff7a1f,#ffd27a,#ff7a1f,#2a0a02);
    background-size:220% 100%;
    animation:lavaFlow 3.2s linear infinite;
    box-shadow:0 0 16px 2px rgba(255,120,30,0.75);
  }
  .panel > *{ position:relative; z-index:1; }
  @keyframes lavaGlow{
    0%,100%{ opacity:0.45; transform:scale(1); }
    50%{ opacity:0.75; transform:scale(1.06); }
  }
  @keyframes lavaFlow{
    0%{ background-position:0% 0%; }
    100%{ background-position:220% 0%; }
  }
  .panel h2{
    font-family:"Press Start 2P","IBM Plex Mono",monospace;
    font-size:16px;
    margin:0 0 14px;
    color:#ffdcb0;
    letter-spacing:0.5px;
    text-shadow:0 0 8px rgba(255,120,30,0.8), 0 0 20px rgba(255,60,10,0.5);
    animation:titleFlicker 2.6s ease-in-out infinite;
  }
  @keyframes titleFlicker{
    0%,100%{ text-shadow:0 0 8px rgba(255,120,30,0.8), 0 0 20px rgba(255,60,10,0.5); }
    50%{ text-shadow:0 0 13px rgba(255,165,70,1), 0 0 28px rgba(255,80,20,0.7); }
  }
  .panel p{
    margin:0 0 18px;
    color:#cba58a;
    font-size:14px;
    line-height:1.65;
  }
  .panel p:empty{ display:none; }
  .panel .stat{
    font-family:"Press Start 2P","IBM Plex Mono",monospace;
    color:#ff9a4d;
    font-size:13px;
  }
  button.playbtn{
    font-family:"Press Start 2P","IBM Plex Mono",monospace;
    font-size:13px;
    background:linear-gradient(180deg,#ff9450,#e8431f);
    color:#200a03;
    border:1px solid #7a2a0a;
    padding:14px 22px;
    border-radius:8px;
    cursor:pointer;
    letter-spacing:0.5px;
    box-shadow:0 4px 0 rgba(0,0,0,0.4), 0 0 16px rgba(255,110,30,0.5);
    transition:transform 0.08s ease;
    animation:btnPulse 2.6s ease-in-out infinite;
  }
  @keyframes btnPulse{
    0%,100%{ box-shadow:0 4px 0 rgba(0,0,0,0.4), 0 0 14px rgba(255,110,30,0.42); }
    50%{ box-shadow:0 4px 0 rgba(0,0,0,0.4), 0 0 26px rgba(255,150,60,0.78); }
  }
  button.playbtn:hover{ transform:translateY(-1px); }
  button.playbtn:active{ transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,0.4); }
  button.playbtn:focus-visible{ outline:3px solid var(--grass); outline-offset:2px; }

  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:14px 22px;
    justify-content:center;
    align-items:center;
  }
  .ctrl{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--muted);
    font-size:13px;
  }
  .key{
    font-family:"IBM Plex Mono",monospace;
    font-weight:600;
    font-size:12px;
    color:var(--ink);
    background:var(--key-bg);
    border:1px solid var(--key-border);
    box-shadow:0 2px 0 var(--key-shadow);
    border-radius:6px;
    padding:6px 9px;
    min-width:20px;
    text-align:center;
  }

  /* ---------- Touch devices (phones / tablets) ----------
     The <html> element gets the "touch" class from JS when the device has a
     touch screen. "menu" is set while the start / game-over panel shows. */
  .touchpad, .rotate-hint{ display:none; }
  html.touch, html.touch body{ overscroll-behavior:none; }
  html.touch body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    overflow:hidden;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    padding:max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
            max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
  }
  html.touch .controls{ display:none; }
  html.touch .wrap{ gap:12px; }
  html.touch .cabinet{ padding:6px; border-radius:14px; }
  html.touch .cabinet::before{ display:none; }
  html.touch button.playbtn{ touch-action:manipulation; }

  html.touch .touchpad{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    width:100%;
    max-width:984px;
    transition:opacity 0.15s ease;
  }
  html.touch.menu .touchpad{ visibility:hidden; opacity:0; }
  .pad-cluster{ display:flex; gap:14px; align-items:flex-end; }
  .pad-right{ gap:12px; }
  .tbtn{
    width:72px;
    height:72px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:system-ui, sans-serif;
    font-size:26px;
    line-height:1;
    color:#ffe2c4;
    background:radial-gradient(circle at 50% 35%, rgba(90,40,20,0.75), rgba(20,8,4,0.75));
    border:2px solid rgba(255,140,60,0.55);
    box-shadow:0 4px 0 rgba(0,0,0,0.45), 0 0 12px rgba(255,100,30,0.25);
    touch-action:none;
    cursor:pointer;
  }
  .tbtn small{ font-family:"Press Start 2P","IBM Plex Mono",monospace; font-size:9px; letter-spacing:0.5px; }
  .tbtn.pressed{
    transform:translateY(3px);
    background:radial-gradient(circle at 50% 35%, rgba(255,140,60,0.85), rgba(120,30,10,0.85));
    box-shadow:0 1px 0 rgba(0,0,0,0.45), 0 0 18px rgba(255,140,60,0.6);
  }
  .tbtn-jump{ width:84px; height:84px; font-size:30px; }
  .tbtn-attack{ margin-bottom:26px; }
  .tbtn-ignite{
    visibility:hidden;
    margin-bottom:60px;
    width:62px; height:62px;
    border-color:#ffd27a;
    animation:btnPulse 1.6s ease-in-out infinite;
  }
  .tbtn-ignite.ready{ visibility:visible; }

  /* Portrait: game on top, buttons underneath, plus a hint to rotate. */
  @media (orientation: portrait){
    html.touch .rotate-hint{
      display:block;
      margin:0;
      color:var(--muted);
      font-size:13px;
      text-align:center;
    }
    html.touch .touchpad{ margin-top:auto; }
    html.touch .wrap{ min-height:calc(100dvh - 40px); }
  }

  /* Landscape: game fills the screen, buttons float over its bottom corners. */
  @media (orientation: landscape){
    html.touch body{ align-items:center; padding-top:0; padding-bottom:0; background:#05060a; }
    html.touch .masthead{ display:none; }
    html.touch .wrap{ max-width:none; }
    html.touch .cabinet{
      padding:0;
      border-radius:0;
      background:none;
      box-shadow:none;
      max-width:none;
      width:min(100%, calc(100vh * 16 / 9));
      width:min(100%, calc(100dvh * 16 / 9));
    }
    html.touch .stage{ border-radius:0; }
    html.touch .touchpad{
      position:fixed;
      left:0; right:0; bottom:0;
      max-width:none;
      padding:0 max(18px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      pointer-events:none;
    }
    html.touch .tbtn{ pointer-events:auto; opacity:0.85; }
  }

  /* Small game area: shrink the start / game-over panel so it still fits. */
  @media (max-height:460px), (max-width:560px){
    .panel{ padding:16px 18px; }
    .panel h2{ font-size:13px; margin-bottom:10px; }
    .panel p{ font-size:12px; line-height:1.5; margin-bottom:12px; }
    button.playbtn{ font-size:11px; padding:11px 16px; }
  }
  @media (max-width:420px){
    .tbtn{ width:64px; height:64px; font-size:22px; }
    .tbtn-jump{ width:76px; height:76px; }
  }

  @media (prefers-reduced-motion: reduce){
    .tbtn-ignite{ animation:none; }
    button.playbtn{ transition:none; animation:none; }
    .panel::before, .panel::after, .panel h2{ animation:none; }
  }
</style>

<div class="wrap">
  <div class="masthead">
    <h1>DEMONIC <span class="accent">FLAME</span></h1>
    <p class="tagline">Run the ridge, cross the Ember Hollow, then drop into the Molten Core to face the Magma Golem.</p>
  </div>

  <div class="cabinet">
    <div class="stage">
      <canvas id="game" width="960" height="540" tabindex="0" aria-label="Demonic Flame game canvas"></canvas>
      <div class="overlay" id="overlay">
        <div class="panel">
          <h2 id="overlayTitle">DEMONIC FLAME</h2>
          <p id="overlayText"></p>
          <button class="playbtn" id="overlayBtn">Enter the Void</button>
        </div>
      </div>
    </div>
  </div>

  <p class="rotate-hint">Turn your device sideways for a bigger view.</p>

  <!-- On-screen buttons, shown only on touch devices. Each data-key is the
       keyboard code it presses, so the game logic treats them like keys. -->
  <div class="touchpad" id="touchpad" aria-hidden="true">
    <div class="pad-cluster pad-left">
      <div class="tbtn" data-key="ArrowLeft">&#9664;</div>
      <div class="tbtn" data-key="ArrowRight">&#9654;</div>
    </div>
    <div class="pad-cluster pad-right">
      <div class="tbtn tbtn-ignite" data-key="KeyX" id="igniteBtn"><small>FIRE</small></div>
      <div class="tbtn tbtn-attack" data-key="Space"><small>ATK</small></div>
      <div class="tbtn tbtn-jump" data-key="ArrowUp">&#9650;</div>
    </div>
  </div>

  <div class="controls">
    <div class="ctrl"><span class="key">&#8592;</span><span class="key">&#8594;</span> or <span class="key">A</span><span class="key">D</span> move</div>
    <div class="ctrl"><span class="key">&#8593;</span> jump</div>
    <div class="ctrl"><span class="key">SPACE</span> attack</div>
    <div class="ctrl"><span class="key">X</span> fire form (4+ imps)</div>
    <div class="ctrl"><span class="key">R</span> restart</div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var VW = canvas.width, VH = canvas.height;

  // ---------- Background music ----------
  // Starts on the player's first interaction with the start overlay (or a
  // restart), which doubles as the user gesture browsers require before
  // audio is allowed to play, so it effectively begins "as soon as the
  // game loads" from the player's perspective.
  var bgMusic = new Audio("assets/bgmusic.mp3");
  bgMusic.loop = true;
  bgMusic.volume = 0.45;
  bgMusic.preload = "auto";
  var musicStarted = false;
  function startMusic(){
    if (musicStarted) return;
    musicStarted = true;
    var p = bgMusic.play();
    if (p && p.catch) p.catch(function(){ musicStarted = false; });
  }
  // Try to play immediately on load. Most browsers block audible autoplay
  // before any user gesture, so if that attempt is rejected, fall back to
  // starting on the very first interaction anywhere on the page (a click,
  // key press, or touch) rather than waiting specifically for the Start
  // button - whichever comes first.
  startMusic();
  ["pointerdown", "keydown", "touchstart"].forEach(function(evt){
    document.addEventListener(evt, startMusic, { capture: true, once: true });
  });

  // One-shot "evil laugh" stinger on every game start/restart. This is a
  // separate Audio instance from bgMusic, so playing it never touches or
  // interrupts the looping background track already running.
  var sfxLaugh = new Audio("assets/sfx_laugh.mp3");
  sfxLaugh.volume = 0.85;
  sfxLaugh.preload = "auto";
  function playStartLaugh(){
    try {
      sfxLaugh.currentTime = 0;
      var p = sfxLaugh.play();
      if (p && p.catch) p.catch(function(){});
    } catch(e) {}
  }

  // ---------- Backdrop art (moonlit forest overlooking the city) ----------
  var bgImg = new Image();
  var bgReady = false;
  var bgDrawW = 0, bgDrawH = 0;
  bgImg.onload = function(){
    var scale = (VH * 1.18) / bgImg.height;
    bgDrawW = bgImg.width * scale;
    bgDrawH = bgImg.height * scale;
    bgReady = true;
  };
  bgImg.src = "assets/background.jpg";

  // Stage 3 backdrop (volcanic cavern). Stages pick a backdrop by key.
  var BACKDROPS = { forest: { img: bgImg } };
  (function(){
    var im = new Image();
    var entry = { img: im, ready: false, w: 0, h: 0 };
    im.onload = function(){
      var scale = (VH * 1.18) / im.height;
      entry.w = im.width * scale; entry.h = im.height * scale; entry.ready = true;
    };
    im.src = "assets/stage3_background.jpg";
    BACKDROPS.cavern = entry;
  })();

  // Magma Golem boss sprites. All poses face RIGHT natively. anchor = [x of the
  // body centre, height] in source pixels, so frames line up at the feet.
  var BOSS_SCALE = 0.6;
  var BOSS_SPRITES = {};
  (function(){
    var anchors = {
      walk0:[213,320], walk1:[253,321], walk2:[244,333], idle:[180,307], jump:[123,328],
      slam:[145,285], throw:[193,304], smoke:[185,308], roar:[206,313], breath:[181,293],
      hover0:[134,392], hover1:[154,357],
      die0:[110,335], die1:[99,331], die2:[115,327], die3:[72,251]
    };
    Object.keys(anchors).forEach(function(key){
      var im = new Image();
      im.ready = false;
      im.onload = function(){ im.ready = true; };
      im.src = "assets/boss_" + key + ".png";
      im.anchorX = anchors[key][0];
      BOSS_SPRITES[key] = im;
    });
  })();

  // Imp enemy sprites (native art faces LEFT; flip when moving right).
  var IMP_SPRITES = {};
  (function(){
    var sources = {
      walk0: "assets/imp_walk0.png",
      walk1: "assets/imp_walk1.png",
      idle:  "assets/imp_idle.png"
    };
    Object.keys(sources).forEach(function(key){
      var im = new Image();
      im.ready = false;
      im.onload = function(){ im.ready = true; };
      im.src = sources[key];
      IMP_SPRITES[key] = im;
    });
  })();

  // Lava-rock platform art: one chunk, tiled/rescaled per platform width.
  var rockImg = new Image();
  rockImg.ready = false;
  rockImg.onload = function(){ rockImg.ready = true; };
  rockImg.src = "assets/rock.png";
  var ROCK_TILE_H = 70; // fixed render height for one repeated rock chunk

  // Player character sprites (shadow-creature artwork). The art faces LEFT natively;
  // we mirror it when the player faces right. Draw size = naturalWidth/2, naturalHeight/2
  // (bitmaps are saved at 2x for crispness).
  var PLAYER_SPRITES = {};
  (function(){
    var sources = {
      walk0:   "assets/player_walk0.png",
      walk2:   "assets/player_walk2.png",
      walk4:   "assets/player_walk4.png",
      walk6:   "assets/player_walk6.png",
      idle:    "assets/player_idle.png",
      jump:    "assets/player_jump.png",
      attack0: "assets/player_attack0.png",
      attack4: "assets/player_attack4.png",
      hurt:    "assets/player_hurt.png",
      death:   "assets/player_death.png"
    };
    Object.keys(sources).forEach(function(key){
      var im = new Image();
      im.ready = false;
      im.onload = function(){ im.ready = true; };
      im.src = sources[key];
      PLAYER_SPRITES[key] = im;
    });
  })();

  // Fire-elemental "ignited" form sprites (unlocked at 4+ imps, activated with X).
  var FIRE_SPRITES = {};
  (function(){
    var sources = {
      walk0:   "assets/fire_walk0.png",
      walk2:   "assets/fire_walk2.png",
      walk4:   "assets/fire_walk4.png",
      walk6:   "assets/fire_walk6.png",
      idle:    "assets/fire_idle.png",
      jump:    "assets/fire_jump.png",
      attack0: "assets/fire_attack0.png",
      attack4: "assets/fire_attack4.png",
      hurt:    "assets/fire_hurt.png",
      death:   "assets/fire_death.png"
    };
    Object.keys(sources).forEach(function(key){
      var im = new Image();
      im.ready = false;
      im.onload = function(){ im.ready = true; };
      im.src = sources[key];
      FIRE_SPRITES[key] = im;
    });
  })();

  // Life flask sprites (blood-flask artwork): index = hits remaining, 0..4
  var FLASK_IMAGES = [];
  (function(){
    var sources = [
      "assets/flask_0.png",
      "assets/flask_1.png",
      "assets/flask_2.png",
      "assets/flask_3.png",
      "assets/flask_4.png"
    ];
    sources.forEach(function(src, i){
      var im = new Image();
      im.ready = false;
      im.onload = function(){ im.ready = true; };
      im.src = src;
      FLASK_IMAGES[i] = im;
    });
  })();

  // Torch HUD sprites (progressive ignition): index = 0..5, state 1..6
  var TORCH_IMAGES = [];
  (function(){
    var sources = [
      "assets/torch_0.png",
      "assets/torch_1.png",
      "assets/torch_2.png",
      "assets/torch_3.png",
      "assets/torch_4.png",
      "assets/torch_5.png"
    ];
    sources.forEach(function(src, i){
      var im = new Image();
      im.ready = false;
      im.onload = function(){ im.ready = true; };
      im.src = src;
      TORCH_IMAGES[i] = im;
    });
  })();

  var overlay = document.getElementById("overlay");
  var overlayTitle = document.getElementById("overlayTitle");
  var overlayText = document.getElementById("overlayText");
  var overlayBtn = document.getElementById("overlayBtn");

  // ---------- World data ----------
  var GROUND_Y = 470;

  function rect(x,y,w,h){ return {x:x,y:y,w:w,h:h}; }

  // ---------- Stages ----------
  // Stages are linked by their exits. Imps you kill stay dead when you return.
  //   exits:   { left: stageIndex, right: stageIndex } walking off that edge
  //            goes to that stage. No exit on a side = a wall.
  //   dropPit: { pit: n, to: stageIndex } the n-th gap in the ground (0 =
  //            first) is a shaft down to another stage instead of lava.
  //   ground:  [startX, endX] solid ground pieces; the space between two
  //            pieces is a lava pit (falling in costs one flask hit).
  //   enemies: [spawnX, patrolLeft, patrolRight, speed, spawnY]. Without
  //            spawnY an imp drops from the sky and lands on whatever is
  //            below; with it, the imp starts standing at that height
  //            (ground = 444, a platform at y = y - 26).
  //   tint:    optional colour washed over the backdrop.
  //   backdrop: "forest" (default) or "cavern".
  //   boss:    true = the Magma Golem lives here; beating it wins the game.
  // Jump limits for laying out platforms: about 140px up, 170px across.
  var STAGES = [
    {
      name: "Moonlit Ridge",
      exits: { right: 1 },
      width: 2500,
      ground: [[0, 2500]],
      platforms: [
        [260, 380, 140], [470, 320, 130], [700, 390, 150], [950, 300, 170],
        [1230, 370, 140], [1460, 300, 150], [1700, 390, 190], [1990, 320, 150],
        [2230, 400, 180]
      ],
      enemies: [
        [340, 290, 470, 1.1], [760, 720, 900, 1.3], [1000, 970, 1130, 1.0],
        [1300, 1250, 1420, 1.2], [1770, 1710, 1880, 1.1], [2050, 2000, 2150, 1.4],
        [2260, 2230, 2400, 1.2]
      ]
    },
    {
      name: "Ember Hollow",
      exits: { left: 0 },
      dropPit: { pit: 2, to: 2 },   // the last pit (1900-2010) drops into the Molten Core
      width: 2800,
      tint: "rgba(120,28,8,0.22)",
      ground: [[0, 620], [720, 1250], [1360, 1900], [2010, 2800]],
      platforms: [
        [180, 390, 120], [330, 310, 120], [500, 230, 140],   // staircase up to a high ledge
        [760, 380, 130], [930, 300, 110], [1100, 380, 120],
        [1275, 330, 70],                                      // stepping stone over the 2nd pit
        [1450, 390, 140], [1640, 310, 120], [1820, 240, 150],
        [2080, 380, 130], [2280, 300, 160], [2500, 380, 140]
      ],
      enemies: [
        [380, 240, 610, 1.3, 444],     // ground, under the staircase, guarding the first pit
        [560, 505, 635, 0.9, 204],     // high ledge
        [1000, 730, 1240, 1.6, 444],   // fast runner between pits
        [1400, 1370, 1890, 1.4, 444],
        [1690, 1645, 1755, 1.0, 284],  // platform
        [1880, 1825, 1965, 1.1, 214],  // high platform
        [2230, 2020, 2470, 1.3, 444],
        [2340, 2285, 2435, 1.0, 274],  // platform above the last stretch
        [2600, 2300, 2790, 1.7, 444]   // fast guard at the far end
      ]
    },
    {
      name: "Molten Core",
      exits: {},
      backdrop: "cavern",
      boss: true,
      entryTopX: 160,               // where you land after dropping in
      width: 1300,
      ground: [[0, 1300]],
      platforms: [
        [200, 350, 150], [575, 280, 150], [950, 350, 150]   // ledges for dodging
      ],
      enemies: []
    }
  ];

  var stageIndex = 0;
  var stageState = [];  // per stage: its live imps, kept between visits
  var WORLD_W, allPlatforms;

  function buildPlatforms(stage){
    var list = stage.ground.map(function(g){ return rect(g[0], GROUND_Y, g[1] - g[0], 70); });
    stage.platforms.forEach(function(p){ list.push(rect(p[0], p[1], p[2], 22)); });
    return list;
  }

  // Lava pits are the gaps between ground pieces.
  function stagePits(stage){
    var pits = [];
    for (var i = 1; i < stage.ground.length; i++){
      pits.push([stage.ground[i-1][1], stage.ground[i][0]]);
    }
    return pits;
  }

  function makeEnemy(spawnX, rangeLo, rangeHi, speed, spawnY){
    return { x:spawnX, y:(spawnY === undefined ? -40 : spawnY), w:30, h:26, vx:speed, vy:0, lo:rangeLo, hi:rangeHi,
             alive:true, hitFlash:0, walkCycle:Math.random()*10, dead_t:0 };
  }

  // ---------- Player ----------
  var GRAVITY = 0.62;
  var MOVE_SPEED = 4.2;
  var SUPER_SPEED_MULT = 2.1; // fire-elemental form moves much faster
  var SUPER_MODE_DURATION = 15 * 60; // fire form lasts 15 real seconds (dt ~ 1 per frame @60fps)
  var JUMP_V = -13.2;
  var MAX_FALL = 16;

  var player, enemies, camX, score, gameState, shake, timeAlive;
  var explosionParticles, explosionFlash;
  var boss = null, fireballs = [], shockwaves = [];

  function resetGame(){
    player = {
      x: 60, y: GROUND_Y - 46, w: 30, h: 46, vx:0, vy:0,
      facing: 1, onGround:false, hp: 4, maxHp:4,
      invuln:0, attackT:0, attackCd:0, walkCycle:0,
      superMode:false, superTimer:0
    };
    stageState = STAGES.map(function(s){
      return {
        enemies: s.enemies.map(function(e){ return makeEnemy(e[0],e[1],e[2],e[3],e[4]); }),
        boss: s.boss ? makeBoss(s.width) : null
      };
    });
    boss = null;
    fireballs = [];
    shockwaves = [];
    score = 0;
    shake = 0;
    timeAlive = 0;
    explosionParticles = [];
    explosionFlash = null;
    loadStage(0, "left");
    gameState = "playing";
  }

  // Switch to a stage. "from" is the edge the player walks in from.
  var stageFade = 0;       // black fade-in after a stage change
  var stageBannerT = 0;    // how long the stage name stays on screen
  var STAGE_BANNER_TIME = 150;
  function loadStage(index, from){
    stageIndex = index;
    var stage = STAGES[index];
    WORLD_W = stage.width;
    allPlatforms = buildPlatforms(stage);
    enemies = stageState[index].enemies;
    boss = stageState[index].boss;
    fireballs = [];
    shockwaves = [];
    explosionParticles = [];
    explosionFlash = null;

    player.vy = 0;
    player.y = GROUND_Y - player.h;
    if (from === "top"){
      // dropped down a shaft: fall in from above the screen
      player.x = stage.entryTopX || 120;
      player.y = -player.h - 20;
      player.facing = 1;
    } else if (from === "right"){
      player.x = WORLD_W - player.w - 40;
      player.facing = -1;
    } else {
      player.x = 40;
      player.facing = 1;
    }
    player.entryX = player.x;   // where to put the player back after a lava fall
    camX = Math.max(0, Math.min(WORLD_W - VW, player.x + player.w/2 - VW/2));
    stageFade = index === 0 && from === "left" && timeAlive === 0 ? 0 : 1;
    stageBannerT = STAGE_BANNER_TIME;
  }

  // Fiery power-up: once you've defeated 4+ imps, pressing X ignites the
  // player permanently into the fire-elemental form, with a one-shot
  // particle explosion + screen shake for impact. While ignited the player
  // moves much faster and is overpowered: simply touching an enemy kills it
  // instantly instead of costing a hit. The form lasts 15 seconds, after
  // which the player reverts to normal and the imp counter resets to 0.
  function triggerSuperMode(){
    player.superMode = true;
    player.superTimer = SUPER_MODE_DURATION;
    shake = 14;
    var cx = player.x + player.w/2, cy = player.y + player.h/2;
    explosionFlash = { x: cx, y: cy, t: 0, maxT: 18 };
    for (var i=0; i<34; i++){
      var angle = Math.random() * Math.PI * 2;
      var speed = 1.5 + Math.random()*5;
      var roll = Math.random();
      var color = roll < 0.25 ? "255,255,235" : (roll < 0.65 ? "255,200,80" : "255,120,40");
      explosionParticles.push({
        x: cx, y: cy,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed*0.8 - 1.5,
        life: 26 + Math.random()*22,
        maxLife: 0,
        size: 2 + Math.random()*3.5,
        color: color
      });
      explosionParticles[explosionParticles.length-1].maxLife = explosionParticles[explosionParticles.length-1].life;
    }
  }

  function updateExplosionFx(dt){
    if (explosionFlash){
      explosionFlash.t += dt;
      if (explosionFlash.t >= explosionFlash.maxT) explosionFlash = null;
    }
    for (var i = explosionParticles.length - 1; i >= 0; i--){
      var p = explosionParticles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= Math.pow(0.92, dt);
      p.vy += -0.03 * dt;
      p.life -= dt;
      if (p.life <= 0) explosionParticles.splice(i, 1);
    }
    // gentle continuous ember trail while transformed, so the fire form
    // keeps feeling alive rather than just a static reskin
    if (player.superMode && gameState === "playing" && Math.random() < 0.35*dt){
      explosionParticles.push({
        x: player.x + player.w/2 + (Math.random()-0.5)*10,
        y: player.y + player.h - 4,
        vx: (Math.random()-0.5)*0.6,
        vy: -0.6 - Math.random()*0.8,
        life: 18 + Math.random()*14,
        maxLife: 30,
        size: 1.2 + Math.random()*2,
        color: Math.random() < 0.5 ? "255,200,80" : "255,120,40"
      });
    }
  }

  function drawExplosionFx(){
    if (explosionFlash){
      var t = explosionFlash.t / explosionFlash.maxT;
      var r = 8 + t*64;
      var alpha = Math.max(0, 1-t);
      var gx = explosionFlash.x - camX, gy = explosionFlash.y;
      var grad = ctx.createRadialGradient(gx, gy, 0, gx, gy, r);
      grad.addColorStop(0, "rgba(255,255,240,"+(alpha*0.9).toFixed(2)+")");
      grad.addColorStop(0.5, "rgba(255,170,60,"+(alpha*0.6).toFixed(2)+")");
      grad.addColorStop(1, "rgba(255,90,30,0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(gx, gy, r, 0, Math.PI*2);
      ctx.fill();
    }
    for (var i=0; i<explosionParticles.length; i++){
      var p = explosionParticles[i];
      var a = Math.max(0, p.life / (p.maxLife || 1));
      ctx.fillStyle = "rgba("+p.color+","+a.toFixed(2)+")";
      ctx.beginPath();
      ctx.arc(p.x - camX, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    }
  }

  // ---------- Input ----------
  var keys = {};
  var WATCHED = ["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space","KeyA","KeyD","KeyR","KeyX"];

  // Shared by the keyboard and the on-screen touch buttons.
  function pressKey(code){
    keys[code] = true;
    if (code === "KeyR" && (gameState === "gameover" || gameState === "win")) {
      startGame();
    }
    if (gameState === "start" && (code === "ArrowUp" || code === "Enter")) {
      startGame();
    }
    if (code === "KeyX" && gameState === "playing" && !player.superMode && score >= 4) {
      triggerSuperMode();
    }
  }
  function releaseKey(code){
    keys[code] = false;
  }

  window.addEventListener("keydown", function(e){
    if (WATCHED.indexOf(e.code) !== -1) e.preventDefault();
    pressKey(e.code);
  });
  window.addEventListener("keyup", function(e){
    releaseKey(e.code);
  });
  canvas.addEventListener("mousedown", function(){ canvas.focus(); });

  // ---------- Touch controls ----------
  var root = document.documentElement;
  var touchpad = document.getElementById("touchpad");
  var igniteBtn = document.getElementById("igniteBtn");
  var padButtons = touchpad.querySelectorAll("[data-key]");
  var touchHeld = {};

  function enableTouchMode(){ root.classList.add("touch"); }
  if (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) enableTouchMode();
  // Touch-screen laptops report a fine pointer, so also switch on first touch.
  window.addEventListener("touchstart", enableTouchMode, { capture: true, once: true, passive: true });

  // Every touch event re-checks which button sits under each finger. That
  // supports several fingers at once (run + jump + attack) and sliding a
  // thumb from one button to the next without lifting it.
  function syncTouches(e){
    if (e.cancelable) e.preventDefault();
    var now = {};
    for (var i = 0; i < e.touches.length; i++){
      var t = e.touches[i];
      var el = document.elementFromPoint(t.clientX, t.clientY);
      var btn = el && el.closest ? el.closest("[data-key]") : null;
      if (btn && touchpad.contains(btn)) now[btn.getAttribute("data-key")] = true;
    }
    Object.keys(now).forEach(function(code){ if (!touchHeld[code]) pressKey(code); });
    Object.keys(touchHeld).forEach(function(code){ if (!now[code]) releaseKey(code); });
    touchHeld = now;
    for (var j = 0; j < padButtons.length; j++){
      var b = padButtons[j];
      b.classList.toggle("pressed", !!now[b.getAttribute("data-key")]);
    }
  }
  ["touchstart", "touchmove", "touchend", "touchcancel"].forEach(function(evt){
    touchpad.addEventListener(evt, syncTouches, { passive: false });
  });
  // Stop iOS pinch / double-tap zoom from hijacking the game.
  document.addEventListener("gesturestart", function(e){ e.preventDefault(); });
  document.addEventListener("dblclick", function(e){ if (root.classList.contains("touch")) e.preventDefault(); });

  function releaseAllKeys(){
    Object.keys(keys).forEach(function(code){ keys[code] = false; });
    touchHeld = {};
    for (var j = 0; j < padButtons.length; j++) padButtons[j].classList.remove("pressed");
  }

  // On phones, try to go full screen and lock to landscape when the game
  // starts. Android browsers allow this; iPhone Safari does not, which is fine.
  function goFullscreenOnTouch(){
    if (!root.classList.contains("touch")) return;
    try {
      if (!document.fullscreenElement && root.requestFullscreen){
        var p = root.requestFullscreen({ navigationUI: "hide" });
        if (p && p.then){
          p.then(function(){
            if (screen.orientation && screen.orientation.lock){
              screen.orientation.lock("landscape").catch(function(){});
            }
          }).catch(function(){});
        }
      }
    } catch(e) {}
  }

  var igniteShown = false;
  function updateTouchUi(){
    var ready = gameState === "playing" && !player.superMode && score >= 4;
    if (ready !== igniteShown){
      igniteShown = ready;
      igniteBtn.classList.toggle("ready", ready);
    }
  }

  function startGame(){
    resetGame();
    releaseAllKeys();
    overlay.hidden = true;
    root.classList.remove("menu");
    canvas.focus();
    goFullscreenOnTouch();
    startMusic();
    playStartLaugh();
  }
  overlayBtn.addEventListener("click", startGame);
  gameState = "start";

  // ---------- Collision ----------
  function intersects(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }

  function moveAndCollide(e, platforms){
    e.x += e.vx;
    for (var i=0;i<platforms.length;i++){
      var p = platforms[i];
      if (intersects(e,p)){
        if (e.vx > 0) e.x = p.x - e.w;
        else if (e.vx < 0) e.x = p.x + p.w;
      }
    }
    e.y += e.vy;
    e.onGround = false;
    for (var j=0;j<platforms.length;j++){
      var p2 = platforms[j];
      if (intersects(e,p2)){
        if (e.vy > 0){ e.y = p2.y - e.h; e.vy = 0; e.onGround = true; }
        else if (e.vy < 0){ e.y = p2.y + p2.h; e.vy = 0; }
      }
    }
  }

  // ---------- Update ----------
  function update(dt){
    if (gameState !== "playing") return;
    timeAlive += dt;

    var left = keys.ArrowLeft || keys.KeyA;
    var right = keys.ArrowRight || keys.KeyD;

    var curSpeed = player.superMode ? MOVE_SPEED * SUPER_SPEED_MULT : MOVE_SPEED;
    if (left && !right){ player.vx = -curSpeed; player.facing = -1; }
    else if (right && !left){ player.vx = curSpeed; player.facing = 1; }
    else player.vx = 0;

    if (keys.ArrowUp && player.onGround){
      player.vy = JUMP_V;
      player.onGround = false;
    }

    player.vy += GRAVITY * dt;
    if (player.vy > MAX_FALL) player.vy = MAX_FALL;

    if (player.vx !== 0) player.walkCycle += 0.25 * dt; else player.walkCycle = 0;

    moveAndCollide(player, allPlatforms);

    // Walking off an edge that has an exit moves to that stage.
    var exits = STAGES[stageIndex].exits || {};
    if (player.x + player.w >= WORLD_W && player.vx > 0 && exits.right !== undefined){
      loadStage(exits.right, "left");
      return;
    }
    if (player.x <= 0 && player.vx < 0 && exits.left !== undefined){
      loadStage(exits.left, "right");
      return;
    }
    if (player.x < 0) player.x = 0;
    if (player.x + player.w > WORLD_W) player.x = WORLD_W - player.w;

    // Fell down the shaft pit: drop into the stage below.
    var drop = STAGES[stageIndex].dropPit;
    if (drop && player.y > VH + 40){
      var shaft = stagePits(STAGES[stageIndex])[drop.pit];
      var midX = player.x + player.w/2;
      if (midX >= shaft[0] - 10 && midX <= shaft[1] + 10){
        loadStage(drop.to, "top");
        return;
      }
    }

    // Fell into a lava pit: lose one flask hit and go back to where you
    // entered this stage.
    if (player.y > VH + 40){
      player.hp -= 1;
      shake = 12;
      if (player.hp <= 0){
        player.hp = 0;
        gameState = "gameover";
        showOverlay("YOU BURNED", "The lava took you. Score: " + score + " · Time: " + Math.floor(timeAlive/60) + "s", "Try Again");
        return;
      }
      player.x = player.entryX;
      player.y = GROUND_Y - player.h;
      player.vy = 0;
      player.invuln = 65;
      camX = Math.max(0, Math.min(WORLD_W - VW, player.x + player.w/2 - VW/2));
      stageFade = 1;
    }
    if (stageFade > 0) stageFade = Math.max(0, stageFade - 0.04 * dt);
    if (stageBannerT > 0) stageBannerT -= dt;

    if (player.attackCd > 0) player.attackCd -= dt;
    if (player.attackT > 0) player.attackT -= dt;
    if (keys.Space && player.attackCd <= 0){
      player.attackT = 14;
      player.attackCd = 26;
    }
    if (player.invuln > 0) player.invuln -= dt;
    if (shake > 0) shake -= dt;
    updateExplosionFx(dt);

    if (player.superMode){
      player.superTimer -= dt;
      if (player.superTimer <= 0){
        player.superMode = false;
        player.superTimer = 0;
        score = 0;
      }
    }

    var hitbox = null;
    if (player.attackT > 8){
      var reach = 30;
      hitbox = player.facing === 1
        ? rect(player.x + player.w, player.y + 6, reach, player.h - 12)
        : rect(player.x - reach, player.y + 6, reach, player.h - 12);
    }

    for (var i=0;i<enemies.length;i++){
      var en = enemies[i];
      if (!en.alive){
        en.dead_t += dt;
        continue;
      }
      en.walkCycle += 0.2 * dt;
      if (en.x <= en.lo) en.vx = Math.abs(en.vx);
      if (en.x + en.w >= en.hi) en.vx = -Math.abs(en.vx);
      en.vy += GRAVITY * dt;
      if (en.vy > MAX_FALL) en.vy = MAX_FALL;
      moveAndCollide(en, allPlatforms);
      if (en.y > VH + 40){ en.alive = false; en.dead_t = 99; continue; }  // fell into lava

      if (en.hitFlash > 0) en.hitFlash -= dt;

      if (hitbox && intersects(hitbox, en)){
        en.alive = false;
        en.hitFlash = 10;
        score += 1;
        shake = 8;
      } else if (player.superMode && intersects(player, en)){
        // overpowered in fire form: mere contact instantly kills the enemy
        // and the player takes no damage at all.
        en.alive = false;
        en.hitFlash = 10;
        score += 1;
        shake = 6;
      } else if (player.invuln <= 0 && intersects(player, en)){
        player.hp -= 1;
        player.invuln = 65;
        shake = 10;
        player.vx = (player.x < en.x ? -1 : 1) * 3;
        player.vy = -6;
        if (player.hp <= 0){
          player.hp = 0;
          gameState = "gameover";
          showOverlay("YOU DIED", "The imps got the better of you. Score: " + score + " · Time: " + Math.floor(timeAlive/60) + "s", "Try Again");
        }
      }
    }

    if (boss && gameState === "playing") updateBoss(dt, hitbox);

    var targetCam = player.x + player.w/2 - VW/2;
    targetCam = Math.max(0, Math.min(WORLD_W - VW, targetCam));
    camX += (targetCam - camX) * Math.min(1, 0.18*dt);
  }

  // Shared "player got hit" handling for the boss and its attacks.
  function hurtPlayer(fromX, deathText){
    if (player.invuln > 0 || player.superMode) return;
    player.hp -= 1;
    player.invuln = 65;
    shake = 12;
    player.vy = -7;
    player.x += (player.x + player.w/2 < fromX ? -1 : 1) * 18;
    player.x = Math.max(0, Math.min(WORLD_W - player.w, player.x));
    if (player.hp <= 0){
      player.hp = 0;
      gameState = "gameover";
      showOverlay("YOU DIED", deathText + " Score: " + score + " · Time: " + Math.floor(timeAlive/60) + "s", "Try Again");
    }
  }

  // ---------- Boss: the Magma Golem ----------
  // A simple state machine. It waits until you land, roars, then walks toward
  // you and picks one of three attacks, resting briefly after each one (the
  // best moment to hit it):
  //   throw  - hurls a fireball at you (3 at once below half health).
  //            Your attack can swat fireballs out of the air.
  //   slam   - leaps at you; landing sends shockwaves both ways (jump them).
  //   breath - short-range flame cone angled at the ground in front of it.
  // Touching it hurts. In fire form you take no damage and touching it hurts
  // the golem instead.
  var BOSS_HP = 14;
  var BOSS_NAME = "MAGMA GOLEM";

  function makeBoss(stageWidth){
    return {
      x: stageWidth - 260, y: GROUND_Y, vx: 0, vy: 0,
      w: 96, h: 160, facing: -1,
      hp: BOSS_HP, maxHp: BOSS_HP, phase2: false,
      state: "waiting", t: 0, anim: 0, nextAttackIn: 80, fired: false,
      hitFlash: 0, invuln: 0, dead_t: 0
    };
  }

  function bossBox(b){ return rect(b.x - b.w/2, b.y - b.h, b.w, b.h); }

  // Mouth position and breath cone, shared by update and draw.
  function bossMouth(b){ return { x: b.x + b.facing * 30, y: b.y - 134 }; }
  var BREATH_LEN = 290;
  function inBreath(b, box){
    var m = bossMouth(b);
    var dx = (box.x + box.w/2 - m.x) * b.facing;
    if (dx < 10 || dx > BREATH_LEN) return false;
    var cy = m.y + dx * 0.45, hh = 14 + dx * 0.13;
    return box.y < cy + hh && box.y + box.h > cy - hh;
  }

  function setBossState(b, s){ b.state = s; b.t = 0; b.fired = false; }

  function damageBoss(b, amount, invuln){
    b.hp -= amount;
    b.invuln = invuln;
    b.hitFlash = 10;
    shake = Math.max(shake, 6);
    if (!b.phase2 && b.hp <= b.maxHp / 2) b.phase2 = true;
    if (b.hp <= 0){
      b.hp = 0;
      setBossState(b, "dead");
      shake = 26;
      fireballs = [];
      shockwaves = [];
      bossBurst(b, 30, 4);
    }
  }

  // Lava and rock spray from the golem's chest.
  function bossBurst(b, count, power){
    explosionFlash = { x: b.x, y: b.y - b.h/2, t: 0, maxT: 30 };
    for (var i = 0; i < count; i++){
      var ang = Math.random() * Math.PI * 2, sp = 2 + Math.random() * power;
      explosionParticles.push({
        x: b.x, y: b.y - b.h/2, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp - 2,
        life: 40 + Math.random()*40, maxLife: 80, size: 2 + Math.random()*4,
        color: ["255,200,80", "255,110,30", "70,50,45"][i % 3]
      });
    }
  }

  // Death animation: crack (die0) -> crumble (die1) -> explode (die2) -> rubble (die3).
  var DIE_FRAMES = [28, 58, 96];

  function spawnFireball(b, angleOffset){
    var hand = { x: b.x + b.facing * 107, y: b.y - 98 };
    var tx = player.x + player.w/2, ty = player.y + player.h/2;
    var ang = Math.atan2(ty - hand.y, tx - hand.x) + angleOffset;
    var sp = 5.2 * (b.phase2 ? 1.25 : 1);
    fireballs.push({ x: hand.x, y: hand.y, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp, r: 17, t: 0 });
  }

  function updateBoss(dt, hitbox){
    var b = boss;
    b.anim += dt;
    if (b.hitFlash > 0) b.hitFlash -= dt;
    if (b.invuln > 0) b.invuln -= dt;

    if (b.state === "dead"){
      var before = b.dead_t;
      b.dead_t += dt;
      if (before < DIE_FRAMES[0] && b.dead_t >= DIE_FRAMES[0]) shake = Math.max(shake, 12);
      if (before < DIE_FRAMES[1] && b.dead_t >= DIE_FRAMES[1]){ shake = 30; bossBurst(b, 80, 8); }
      if (before < DIE_FRAMES[2] && b.dead_t >= DIE_FRAMES[2]) shake = Math.max(shake, 10);
      if (b.dead_t > 200 && gameState === "playing"){
        gameState = "win";
        var lifePct = Math.round((player.hp / player.maxHp) * 100);
        showOverlay("THE GOLEM FALLS!", "You shattered the Magma Golem with " + score + " imp" + (score===1?"":"s") + " defeated and " + lifePct + "% of your flask still full.", "Play Again");
      }
      return;
    }

    var mul = b.phase2 ? 1.35 : 1;
    var pcx = player.x + player.w/2;
    var dist = pcx - b.x;
    var canTurn = b.state === "walk" || b.state === "rest" || b.state === "intro" ||
                  (b.state === "throw" && b.t < 20) || (b.state === "slam" && b.t < 10);
    if (canTurn && Math.abs(dist) > 20) b.facing = dist > 0 ? 1 : -1;

    b.t += dt;
    switch (b.state){
      case "waiting":
        if (player.onGround){ setBossState(b, "intro"); shake = 10; }
        break;
      case "intro":
        if (b.t > 110) { setBossState(b, "walk"); b.nextAttackIn = 60; }
        break;
      case "walk":
        if (Math.abs(dist) > 70) b.x += (dist > 0 ? 1 : -1) * 1.2 * mul * dt;
        if (b.t > b.nextAttackIn){
          var d = Math.abs(dist), r = Math.random();
          if (d < 240) setBossState(b, r < 0.6 ? "breath" : "slam");
          else if (d > 430) setBossState(b, r < 0.7 ? "throw" : "slam");
          else setBossState(b, r < 0.5 ? "throw" : "slam");
        }
        break;
      case "throw":
        if (b.t >= 28 && !b.fired){
          b.fired = true;
          if (b.phase2){ spawnFireball(b, -0.2); spawnFireball(b, 0); spawnFireball(b, 0.2); }
          else spawnFireball(b, 0);
        }
        if (b.t > 62) setBossState(b, "rest");
        break;
      case "slam":   // crouch, then leap toward where the player is
        if (b.t >= 22){
          var air = 2 * 13.5 / GRAVITY;
          b.vy = -13.5;
          b.vx = Math.max(-9, Math.min(9, (pcx - b.x) / air));
          setBossState(b, "air");
        }
        break;
      case "air":
        b.vy += GRAVITY * dt;
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        if (b.y >= GROUND_Y && b.vy > 0){
          b.y = GROUND_Y; b.vy = 0; b.vx = 0;
          setBossState(b, "land");
          shake = 18;
          shockwaves.push({ x: b.x - 40, dir: -1, t: 0 }, { x: b.x + 40, dir: 1, t: 0 });
        }
        break;
      case "land":
        if (b.t > 34) setBossState(b, "rest");
        break;
      case "breath":  // 30 frames wind-up, then 70 frames of flame
        if (b.t >= 30 && b.t <= 100 && inBreath(b, player))
          hurtPlayer(b.x, "The Magma Golem burned you to ash.");
        if (b.t > 100) setBossState(b, "rest");
        break;
      case "rest":
        if (b.t > (b.phase2 ? 28 : 55)){ setBossState(b, "walk"); b.nextAttackIn = (50 + Math.random()*60) / mul; }
        break;
    }
    b.x = Math.max(70, Math.min(WORLD_W - 70, b.x));

    // getting hit
    var box = bossBox(b);
    if (b.state !== "waiting" && b.invuln <= 0){
      if (hitbox && intersects(hitbox, box)) damageBoss(b, 1, 22);
      else if (player.superMode && intersects(player, box)) damageBoss(b, 1, 40);
    }
    if (b.state === "dead") return;
    if (b.state !== "waiting" && intersects(player, box)) hurtPlayer(b.x, "The Magma Golem crushed you.");

    // fireballs
    for (var i = fireballs.length - 1; i >= 0; i--){
      var f = fireballs[i];
      f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt;
      var fb = rect(f.x - f.r, f.y - f.r, f.r*2, f.r*2);
      var gone = f.x < -40 || f.x > WORLD_W + 40 || f.y > GROUND_Y || f.t > 400;
      if (!gone && hitbox && intersects(hitbox, fb)){ gone = true; shake = Math.max(shake, 4); }
      else if (!gone && intersects(player, fb)){ gone = true; hurtPlayer(f.x, "A fireball got you."); }
      if (gone){
        for (var k = 0; k < 10; k++){
          explosionParticles.push({ x: f.x, y: Math.min(f.y, GROUND_Y - 4), vx: (Math.random()-0.5)*4, vy: -Math.random()*3,
            life: 18 + Math.random()*12, maxLife: 30, size: 1.5 + Math.random()*2, color: "255,170,60" });
        }
        fireballs.splice(i, 1);
      }
    }

    // ground shockwaves
    for (var j = shockwaves.length - 1; j >= 0; j--){
      var s = shockwaves[j];
      s.t += dt; s.x += s.dir * 6.5 * mul * dt;
      if (intersects(player, rect(s.x - 16, GROUND_Y - 34, 32, 34))) hurtPlayer(s.x, "The golem's shockwave got you.");
      if (s.x < -40 || s.x > WORLD_W + 40) shockwaves.splice(j, 1);
    }
  }

  function bossPose(b){
    switch (b.state){
      case "waiting": return "idle";
      case "intro": return "roar";
      case "walk": return ["walk0","walk1","walk2","walk1"][Math.floor(b.anim * 0.09) % 4];
      case "throw": return b.t < 22 ? "idle" : "throw";
      case "slam": return "smoke";
      case "air": return b.vy < 0 ? "jump" : (Math.floor(b.anim*0.15) % 2 ? "hover0" : "hover1");
      case "land": return "slam";
      case "breath": return b.t < 30 ? "smoke" : "breath";
      case "dead": return b.dead_t < DIE_FRAMES[0] ? "die0" : b.dead_t < DIE_FRAMES[1] ? "die1" : b.dead_t < DIE_FRAMES[2] ? "die2" : "die3";
      default: return "idle";
    }
  }

  function drawBoss(){
    var b = boss;
    if (!b) return;
    var img = BOSS_SPRITES[bossPose(b)];
    var sx = b.x - camX;
    ctx.save();
    // fiery aura in phase 2
    if (b.phase2 && b.state !== "dead"){
      var ag = ctx.createRadialGradient(sx, b.y - 90, 10, sx, b.y - 90, 150);
      ag.addColorStop(0, "rgba(255,120,30,0.28)");
      ag.addColorStop(1, "rgba(255,80,20,0)");
      ctx.fillStyle = ag;
      ctx.fillRect(sx - 150, b.y - 240, 300, 260);
    }
    // ground shadow
    var air = Math.max(0, GROUND_Y - b.y);
    ctx.fillStyle = "rgba(0,0,0," + Math.max(0.15, 0.5 - air/400).toFixed(2) + ")";
    ctx.beginPath();
    ctx.ellipse(sx, GROUND_Y + 2, 70 - Math.min(40, air/6), 9, 0, 0, Math.PI*2);
    ctx.fill();
    if (img && img.ready){
      var S = BOSS_SCALE;
      var shudder = b.state === "dead" && b.dead_t < DIE_FRAMES[2] ? (Math.random()-0.5)*5 : 0;
      ctx.translate(sx + shudder, b.y);
      if (b.facing < 0) ctx.scale(-1, 1);
      if (b.hitFlash > 0) ctx.filter = "brightness(2.2) saturate(0.6)";
      ctx.drawImage(img, -img.anchorX * S, -img.naturalHeight * S, img.naturalWidth * S, img.naturalHeight * S);
    } else {
      ctx.fillStyle = "#3a1a10";
      ctx.fillRect(sx - b.w/2, b.y - b.h, b.w, b.h);
    }
    ctx.restore();

    if (b.state === "breath" && b.t >= 30 && b.t <= 100) drawBreath(b);
  }

  function drawBreath(b){
    var m = bossMouth(b);
    var grow = Math.min(1, (b.t - 30) / 10) * Math.min(1, (100 - b.t) / 10 + 0.2);
    var len = BREATH_LEN * grow;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (var i = 0; i < 26; i++){
      var dx = (i / 26) * len + Math.random() * 10;
      var cx = m.x + b.facing * dx - camX, cy = m.y + dx * 0.45 + (Math.random()-0.5) * dx * 0.12;
      var r = 8 + dx * 0.13;
      var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      var heat = 1 - dx / BREATH_LEN;
      g.addColorStop(0, "rgba(255," + Math.round(200 + 55*heat) + "," + Math.round(120*heat) + ",0.55)");
      g.addColorStop(1, "rgba(255,80,10,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  function drawBossAttacks(){
    for (var i = 0; i < fireballs.length; i++){
      var f = fireballs[i], fx = f.x - camX;
      // tail
      for (var k = 1; k <= 5; k++){
        var tx = fx - f.vx * k * 2.2, ty = f.y - f.vy * k * 2.2;
        ctx.fillStyle = "rgba(255," + (150 - k*18) + ",40," + (0.35 - k*0.05).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(tx, ty, f.r * (1 - k*0.13), 0, Math.PI*2); ctx.fill();
      }
      var g = ctx.createRadialGradient(fx, f.y, 2, fx, f.y, f.r * 1.6);
      g.addColorStop(0, "rgba(255,250,200,1)");
      g.addColorStop(0.4, "rgba(255,190,60,0.95)");
      g.addColorStop(1, "rgba(255,80,20,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(fx, f.y, f.r * 1.6, 0, Math.PI*2); ctx.fill();
    }
    for (var j = 0; j < shockwaves.length; j++){
      var s = shockwaves[j], sx = s.x - camX;
      var flick = 0.8 + 0.2 * Math.sin(s.t * 0.9);
      var g2 = ctx.createLinearGradient(0, GROUND_Y - 40, 0, GROUND_Y);
      g2.addColorStop(0, "rgba(255,200,80,0)");
      g2.addColorStop(0.5, "rgba(255,140,40," + (0.8*flick).toFixed(2) + ")");
      g2.addColorStop(1, "rgba(255,230,140,0.95)");
      ctx.fillStyle = g2;
      ctx.beginPath();
      ctx.moveTo(sx - 20, GROUND_Y);
      ctx.quadraticCurveTo(sx - 6 * s.dir, GROUND_Y - 44 * flick, sx + 16 * s.dir, GROUND_Y);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawBossBar(){
    var b = boss;
    if (!b || b.state === "waiting" || (b.state === "dead" && b.dead_t > 60)) return;
    var w = 360, h = 12, x = VW/2 - w/2, y = 34;
    ctx.save();
    ctx.fillStyle = "rgba(10,6,8,0.6)";
    roundRect(x - 10, y - 24, w + 20, h + 34, 10);
    ctx.fill();
    ctx.fillStyle = "#ffcf9e";
    ctx.font = "10px 'Press Start 2P', monospace";
    ctx.textAlign = "center";
    ctx.fillText(BOSS_NAME, VW/2, y - 8);
    ctx.fillStyle = "#2a1210";
    roundRect(x, y, w, h, 4); ctx.fill();
    var pct = b.hp / b.maxHp;
    var g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, "#ff4a1c"); g.addColorStop(1, "#ffb347");
    ctx.fillStyle = g;
    if (pct > 0){ roundRect(x + 1, y + 1, Math.max(4, (w - 2) * pct), h - 2, 3); ctx.fill(); }
    ctx.restore();
  }

  function showOverlay(title, text, btnLabel){
    overlayTitle.textContent = title;
    overlayText.textContent = text;
    overlayBtn.textContent = btnLabel;
    overlay.hidden = false;
    root.classList.add("menu");
  }

  // ---------- Render ----------
  function drawBackground(){
    var backdrop = STAGES[stageIndex].backdrop;
    if (backdrop && backdrop !== "forest"){
      var bd = BACKDROPS[backdrop];
      if (bd && bd.ready){
        var shift = WORLD_W - VW > 0 ? camX / (WORLD_W - VW) : 0;
        ctx.drawImage(bd.img, -shift * Math.max(0, bd.w - VW), -(bd.h - VH) / 2, bd.w, bd.h);
      } else {
        ctx.fillStyle = "#2a0d06";
        ctx.fillRect(0, 0, VW, VH);
      }
      // the cavern art is bright and busy: dim it so the golem, ledges and
      // fireballs stand out against it
      ctx.fillStyle = "rgba(22,8,10,0.52)";
      ctx.fillRect(0, 0, VW, VH);
      var vg2 = ctx.createLinearGradient(0, VH*0.5, 0, VH);
      vg2.addColorStop(0, "rgba(8,4,4,0)");
      vg2.addColorStop(1, "rgba(8,4,4,0.45)");
      ctx.fillStyle = vg2;
      ctx.fillRect(0,0,VW,VH);
      return;
    }
    if (!bgReady){
      // fallback while the artwork loads
      var g = ctx.createLinearGradient(0,0,0,VH);
      g.addColorStop(0, "#171326");
      g.addColorStop(1, "#2c2338");
      ctx.fillStyle = g;
      ctx.fillRect(0,0,VW,VH);
      return;
    }
    var maxShift = Math.max(0, bgDrawW - VW);
    var camPct = WORLD_W - VW > 0 ? camX / (WORLD_W - VW) : 0;
    var shiftX = -camPct * maxShift;
    var shiftY = -(bgDrawH - VH) / 2;
    ctx.drawImage(bgImg, shiftX, shiftY, bgDrawW, bgDrawH);

    // gentle depth vignette so platforms & sprites stay legible over the art
    var vg = ctx.createLinearGradient(0, VH*0.45, 0, VH);
    vg.addColorStop(0, "rgba(8,6,16,0)");
    vg.addColorStop(1, "rgba(8,6,16,0.55)");
    ctx.fillStyle = vg;
    ctx.fillRect(0,0,VW,VH);

    var tint = STAGES[stageIndex].tint;
    if (tint){
      ctx.fillStyle = tint;
      ctx.fillRect(0,0,VW,VH);
    }
  }

  function drawPlatform(p){
    var sx = p.x - camX;
    if (sx + p.w < 0 || sx > VW) return;

    if (!rockImg.ready){
      // fallback flat block while the art decodes
      ctx.fillStyle = "#3a2a22";
      ctx.fillRect(sx, p.y, p.w, p.h);
      return;
    }

    var srcW = rockImg.naturalWidth, srcH = rockImg.naturalHeight;
    var aspect = srcW / srcH;
    var tileW = ROCK_TILE_H * aspect;

    if (p.w <= tileW){
      // small platform: shrink the whole chunk (both tapered ends visible), no distortion
      var h = p.w / aspect;
      ctx.drawImage(rockImg, sx, p.y, p.w, h);
    } else {
      // wide platform (e.g. the ground): repeat the chunk at a fixed scale, clip the last tile
      var x = sx;
      var remaining = p.w;
      while (remaining > 0){
        var drawW = Math.min(tileW, remaining);
        var srcCropW = (drawW / tileW) * srcW;
        ctx.drawImage(rockImg, 0, 0, srcCropW, srcH, x, p.y, drawW, ROCK_TILE_H);
        x += drawW;
        remaining -= drawW;
      }
    }
  }

  // Lava glowing up out of the gaps between ground pieces.
  function drawPits(){
    var pits = stagePits(STAGES[stageIndex]);
    var drop = STAGES[stageIndex].dropPit;
    var pulse = 0.75 + 0.25 * Math.sin(timeAlive * 0.08);
    for (var i = 0; i < pits.length; i++){
      var sx = pits[i][0] - camX, w = pits[i][1] - pits[i][0];
      if (sx + w < 0 || sx > VW) continue;
      if (drop && drop.pit === i){ drawShaft(sx, w); continue; }
      var g = ctx.createLinearGradient(0, GROUND_Y, 0, VH);
      g.addColorStop(0, "rgba(10,4,4,0.9)");
      g.addColorStop(0.55, "rgba(140,30,6," + (0.85*pulse).toFixed(2) + ")");
      g.addColorStop(1, "rgba(255,150,40," + pulse.toFixed(2) + ")");
      ctx.fillStyle = g;
      ctx.fillRect(sx, GROUND_Y, w, VH - GROUND_Y);
      // heat glow rising above the pit so it reads as danger from a distance
      var cx = sx + w/2;
      var hg = ctx.createRadialGradient(cx, GROUND_Y + 30, 4, cx, GROUND_Y + 30, w * 0.9);
      hg.addColorStop(0, "rgba(255,140,40," + (0.55*pulse).toFixed(2) + ")");
      hg.addColorStop(1, "rgba(255,90,20,0)");
      ctx.fillStyle = hg;
      ctx.fillRect(sx - w*0.4, GROUND_Y - w*0.9, w*1.8, w*0.9 + 40);
      // a few embers drifting up
      for (var e = 0; e < 3; e++){
        var t = (timeAlive*0.5 + e*3.3 + i*1.7) % 10;
        var ex = sx + w*(0.25 + 0.25*e) + Math.sin(timeAlive*0.05 + e)*6;
        var ey = GROUND_Y + 10 - t*9;
        var ea = Math.max(0, 1 - t/10);
        ctx.fillStyle = "rgba(255,190,90," + (ea*0.9).toFixed(2) + ")";
        ctx.beginPath();
        ctx.arc(ex, ey, 1.5 + ea, 0, Math.PI*2);
        ctx.fill();
      }
    }
  }

  // The shaft pit: a dark drop with embers sinking into it and pulsing
  // down-chevrons, so it reads as "a way down", not lava.
  function drawShaft(sx, w){
    var g = ctx.createLinearGradient(0, GROUND_Y, 0, VH);
    g.addColorStop(0, "rgba(6,3,4,0.95)");
    g.addColorStop(1, "rgba(0,0,0,1)");
    ctx.fillStyle = g;
    ctx.fillRect(sx, GROUND_Y, w, VH - GROUND_Y);
    var hg = ctx.createRadialGradient(sx + w/2, GROUND_Y, 4, sx + w/2, GROUND_Y, w);
    hg.addColorStop(0, "rgba(120,40,255,0.18)");
    hg.addColorStop(1, "rgba(120,40,255,0)");
    ctx.fillStyle = hg;
    ctx.fillRect(sx - w/2, GROUND_Y - w, w*2, w + 70);
    for (var e = 0; e < 5; e++){
      var t = (timeAlive*0.4 + e*2.1) % 10;
      var ex = sx + w*(0.15 + 0.17*e);
      var ey = GROUND_Y - 60 + t*12;
      var ea = Math.min(1, t/3) * Math.max(0, 1 - t/10);
      ctx.fillStyle = "rgba(255,170,90," + (ea*0.8).toFixed(2) + ")";
      ctx.beginPath(); ctx.arc(ex, ey, 1.6, 0, Math.PI*2); ctx.fill();
    }
    var bob = 4 * Math.sin(timeAlive * 0.1);
    ctx.strokeStyle = "rgba(255,210,170," + (0.45 + 0.35*pulseOf(timeAlive)).toFixed(2) + ")";
    ctx.lineWidth = 3;
    for (var c = 0; c < 2; c++){
      var cy = GROUND_Y - 70 + c*14 + bob, cx = sx + w/2;
      ctx.beginPath(); ctx.moveTo(cx - 12, cy); ctx.lineTo(cx, cy + 10); ctx.lineTo(cx + 12, cy); ctx.stroke();
    }
  }
  function pulseOf(t){ return 0.5 + 0.5 * Math.sin(t * 0.1); }

  // A soft ember glow and arrow at any edge that leads to another stage.
  function drawExitHints(){
    var pulse = 0.5 + 0.5 * Math.sin(timeAlive * 0.1);
    function hint(worldX, dir){
      var sx = worldX - camX;
      if (sx < -60 || sx > VW + 60) return;
      var gy = GROUND_Y - 60;
      var g = ctx.createRadialGradient(sx, gy, 4, sx, gy, 110);
      g.addColorStop(0, "rgba(255,130,50," + (0.30 + 0.20*pulse).toFixed(2) + ")");
      g.addColorStop(1, "rgba(255,110,40,0)");
      ctx.fillStyle = g;
      ctx.fillRect(sx - 110, gy - 110, 220, 220);
      ctx.fillStyle = "rgba(255,225,180," + (0.55 + 0.45*pulse).toFixed(2) + ")";
      ctx.font = "bold 22px 'Press Start 2P', monospace";
      ctx.textAlign = "center";
      ctx.fillText(dir > 0 ? "\u203A" : "\u2039", sx - dir * 26 + dir * 4 * pulse, gy + 8);
      ctx.textAlign = "left";
    }
    var exits = STAGES[stageIndex].exits || {};
    if (exits.left !== undefined) hint(0, -1);
    if (exits.right !== undefined) hint(WORLD_W, 1);
  }

  function drawStageBanner(){
    if (stageFade > 0){
      ctx.fillStyle = "rgba(5,3,4," + stageFade.toFixed(2) + ")";
      ctx.fillRect(0, 0, VW, VH);
    }
    if (stageBannerT <= 0) return;
    var t = stageBannerT / STAGE_BANNER_TIME;          // 1 → 0
    var a = Math.min(1, t * 4, (1 - t) * 6 + 0.001);   // fade in fast, out slow
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, a));
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffb57a";
    ctx.font = "12px 'Press Start 2P', monospace";
    ctx.fillText("STAGE " + (stageIndex + 1), VW/2, 92);
    ctx.fillStyle = "#ffe2c4";
    ctx.shadowColor = "rgba(255,90,20,0.9)";
    ctx.shadowBlur = 16;
    ctx.font = "26px 'Press Start 2P', monospace";
    ctx.fillText(STAGES[stageIndex].name.toUpperCase(), VW/2, 130);
    ctx.restore();
  }

  var IMP_WALK_FRAMES = ["walk0","walk1"];

  function drawEnemy(en){
    if (en.dead_t > 18) return;
    var sx = en.x - camX;
    if (sx + en.w < -20 || sx > VW+20) return;

    var key = en.alive ? IMP_WALK_FRAMES[Math.floor(en.walkCycle) % 2] : "idle";
    var img = IMP_SPRITES[key];
    var fade = en.alive ? 1 : Math.max(0, 1 - en.dead_t/18);

    ctx.save();
    ctx.globalAlpha = fade;

    if (img && img.ready){
      var dW = img.naturalWidth / 2;
      var dH = img.naturalHeight / 2;
      var cx = sx + en.w/2, footY = en.y + en.h;
      ctx.translate(cx, footY);
      if (en.vx > 0) ctx.scale(-1, 1); // art faces left natively
      if (en.hitFlash > 0){
        ctx.filter = "brightness(2.4) saturate(0.3)";
      }
      ctx.drawImage(img, -dW/2, -dH, dW, dH);
    } else {
      ctx.fillStyle = "#8a5cf6";
      ctx.beginPath();
      ctx.ellipse(sx+en.w/2, en.y+en.h/2, en.w/2, en.h/2, 0, 0, Math.PI*2);
      ctx.fill();
    }

    ctx.restore();
  }

  var WALK_FRAMES = ["walk0","walk2","walk4","walk6"];

  function pickPlayerSpriteKey(){
    if (gameState === "gameover") return "death";
    if (player.invuln > 50) return "hurt";
    if (player.attackT > 0) return player.attackT > 8 ? "attack4" : "attack0";
    if (!player.onGround) return "jump";
    if (player.vx !== 0) return WALK_FRAMES[Math.floor(player.walkCycle) % WALK_FRAMES.length];
    return "idle";
  }

  // Most cropped frames face left natively; the reach/attack row (and the crawl death
  // frame cropped from it) was drawn facing right instead, so it needs the opposite flip.
  var SPRITE_FACES_RIGHT = {
    attack0: true, attack4: true, death: true,
    walk0: true, walk2: true, walk4: true, walk6: true, jump: true
  };

  // Fire-elemental "ignited" form, unlocked once 4+ imps are defeated and
  // activated with X. The run frames' leading leg (the real tell for facing,
  // not which hand holds the fireball) plus the reach/throw attack and the
  // collapsed death frame are all natively right-facing.
  var FIRE_SPRITE_FACES_RIGHT = {
    attack0: true, attack4: true, death: true,
    walk0: true, walk2: true, walk4: true, walk6: true, jump: true
  };

  function drawPlayer(){
    var sx = player.x - camX;
    var blink = player.invuln > 0 && player.invuln <= 50 && Math.floor(player.invuln/4) % 2 === 0;
    var key = pickPlayerSpriteKey();
    var spriteSet = player.superMode ? FIRE_SPRITES : PLAYER_SPRITES;
    var facesRight = player.superMode ? FIRE_SPRITE_FACES_RIGHT : SPRITE_FACES_RIGHT;
    var img = spriteSet[key] || spriteSet.idle;

    ctx.save();
    ctx.globalAlpha = blink ? 0.4 : 1;

    if (img && img.ready){
      var dW = img.naturalWidth / 2;
      var dH = img.naturalHeight / 2;
      // anchor at the hitbox's bottom-center (feet), let the art overhang above/around it
      var cx = sx + player.w/2;
      var footY = player.y + player.h;
      ctx.translate(cx, footY);
      var nativeRight = !!facesRight[key];
      var wantRight = player.facing === 1;
      if (wantRight !== nativeRight) ctx.scale(-1, 1);
      ctx.drawImage(img, -dW/2, -dH, dW, dH);
    } else {
      // fallback silhouette while sprites decode
      ctx.fillStyle = "#1b1f2a";
      ctx.fillRect(sx+4, player.y, player.w-8, player.h);
    }

    ctx.restore();
  }

  function drawHUD(){
    drawLifeFlask();
    drawTorchCounter();
  }

  function drawTorchCounter(){
    // Torch state advances with score (imps defeated). Score 0 already shows
    // the first lit/ember sprite (index 1) rather than the fully unlit stick
    // (index 0, no longer reachable), so every state is shifted up by one.
    // Capping at the final, fully-ablaze sprite once score reaches the top
    // of the range so it never resets or overflows past the last frame.
    var idx = Math.min(score + 1, TORCH_IMAGES.length - 1);
    var img = TORCH_IMAGES[idx];

    if (img && img.ready){
      var dispH = 108, padX = 14, padTop = 10, padBottom = 22;
      var dispW = dispH * (img.naturalWidth / img.naturalHeight);
      var boxW = dispW + padX*2, boxH = dispH + padTop + padBottom;
      var boxX = VW - boxW - 16, boxY = 10;

      ctx.fillStyle = "rgba(10,8,14,0.5)";
      roundRect(boxX, boxY, boxW, boxH, 12);
      ctx.fill();

      var maxed = idx === TORCH_IMAGES.length - 1;
      if (maxed){
        // Fully-lit torch gets a continuous procedural flicker so it reads
        // as a living flame instead of a static swapped-in image: a gentle
        // scale/brightness pulse plus a few rising embers.
        var scalePulse = 1 + 0.035*Math.sin(timeAlive*0.15) + 0.015*Math.sin(timeAlive*0.37+1.3);
        var jitterX = Math.sin(timeAlive*0.5)*1.1 + Math.sin(timeAlive*0.23)*0.5;
        var bright = 1 + 0.10*Math.sin(timeAlive*0.22) + 0.05*Math.sin(timeAlive*0.6+2);

        ctx.save();
        ctx.filter = "brightness(" + bright.toFixed(3) + ")";
        var cx = boxX + padX + dispW/2 + jitterX;
        var cy = boxY + padTop + dispH;
        ctx.translate(cx, cy);
        ctx.scale(scalePulse, scalePulse);
        ctx.drawImage(img, -dispW/2, -dispH, dispW, dispH);
        ctx.restore();

        for (var e=0; e<4; e++){
          var t = (timeAlive*0.6 + e*2.5) % 10;
          var ex = boxX + padX + dispW/2 + Math.sin(timeAlive*0.4 + e*2.1)*dispW*0.28;
          var ey = boxY + padTop + dispH*0.35 - t*9;
          var ea = Math.max(0, 1 - t/10);
          if (ea <= 0) continue;
          ctx.fillStyle = "rgba(255,150,60," + (ea*0.8).toFixed(2) + ")";
          ctx.beginPath();
          ctx.arc(ex, ey, 1.6*ea + 0.4, 0, Math.PI*2);
          ctx.fill();
        }
      } else {
        ctx.drawImage(img, boxX + padX, boxY + padTop, dispW, dispH);
      }

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 12px 'IBM Plex Mono', monospace";
      ctx.textAlign = "center";
      ctx.fillText(score + (score===1 ? " imp" : " imps"), boxX + boxW/2, boxY + padTop + dispH + 16);
      ctx.textAlign = "left";
    } else {
      // simple fallback while the torch art decodes
      var label = "IMPS  " + score;
      ctx.font = "bold 13px 'IBM Plex Mono', monospace";
      var tw = ctx.measureText(label).width;
      ctx.fillStyle = "rgba(10,8,14,0.55)";
      roundRect(VW-tw-40, 14, tw+28, 30, 8);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.fillText(label, VW-tw-26, 30);
    }
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawLifeFlask(){
    var backX = 16, backY = 10, dispH = 138, padX = 16, padTop = 8, padBottom = 20;
    var level = Math.max(0, Math.min(4, Math.round(player.hp)));
    var img = FLASK_IMAGES[level];

    if (img && img.ready){
      var dispW = dispH * (img.naturalWidth / img.naturalHeight);
      ctx.fillStyle = "rgba(10,8,14,0.5)";
      roundRect(backX, backY, dispW + padX*2, dispH + padTop + padBottom, 12);
      ctx.fill();

      var shake2 = player.invuln > 0 && Math.floor(player.invuln/4)%2===0 ? 3 : 0;
      ctx.drawImage(img, backX + padX + shake2, backY + padTop, dispW, dispH);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 12px 'IBM Plex Mono', monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      ctx.fillText(level + " / 4", backX + padX + dispW/2, backY + padTop + dispH + 15);
      ctx.textAlign = "left";
    } else {
      // simple fallback bar while the flask art decodes
      var barX = 20, barY = 18, barW = 180, barH = 20;
      ctx.fillStyle = "rgba(10,8,14,0.55)";
      roundRect(barX-6, barY-6, barW+12, barH+12, 8);
      ctx.fill();
      ctx.fillStyle = "#241b1b";
      roundRect(barX, barY, barW, barH, 5);
      ctx.fill();
      var pct = Math.max(0, player.hp / player.maxHp);
      ctx.fillStyle = "#c9382a";
      roundRect(barX+2, barY+2, Math.max(0,(barW-4)*pct), barH-4, 4);
      ctx.fill();
    }
  }

  function render(){
    ctx.save();
    var sx = 0, sy = 0;
    if (shake > 0){
      sx = (Math.random()-0.5) * shake * 0.6;
      sy = (Math.random()-0.5) * shake * 0.6;
    }
    ctx.translate(sx, sy);

    drawBackground();

    ctx.save();
    drawPits();
    allPlatforms.forEach(drawPlatform);
    drawExitHints();
    enemies.forEach(drawEnemy);
    drawBoss();
    if (gameState !== "start") drawPlayer();
    drawBossAttacks();
    drawExplosionFx();
    ctx.restore();

    ctx.restore();

    if (gameState === "playing" || gameState === "win" || gameState === "gameover"){
      drawHUD();
      drawBossBar();
    }
    if (gameState === "playing") drawStageBanner();
  }

  // ---------- Loop ----------
  var lastTime = null;
  function frame(ts){
    if (lastTime === null) lastTime = ts;
    var dtMs = ts - lastTime;
    lastTime = ts;
    var dt = dtMs / 16.6667;
    // A big stall (audio decoding, tab backgrounded, a GC pause, etc.) would
    // otherwise inject one oversized physics step - e.g. applying several
    // frames' worth of gravity in a single frame cuts a jump's upward
    // velocity down disproportionately, making it peak lower than normal.
    // Past a certain gap, skip that frame's simulation entirely rather than
    // trying to catch up; moderate lag still gets clamped and caught up.
    if (dt > 5) dt = 0;
    else if (dt > 2.5) dt = 2.5;

    update(dt);
    render();
    updateTouchUi();

    requestAnimationFrame(frame);
  }

  resetGame();
  gameState = "start";
  root.classList.add("menu");
  render();
  requestAnimationFrame(frame);
})();
</script>
