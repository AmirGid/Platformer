<title>Slime Bash</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    --ink:#1b1f2a;
    --paper:#f2ede1;
    --paper-raised:#ffffff;
    --paper-border:#d9d0ba;
    --muted:#6b6455;
    --accent:#e8543e;
    --accent-ink:#ffffff;
    --grass:#3aa66b;
    --sky-bezel:#12141c;
    --key-bg:#ffffff;
    --key-border:#c9bfa4;
    --key-shadow:#c9bfa4;
    --shadow-soft: 0 10px 30px rgba(27,31,42,0.12);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#f0ece0;
      --paper:#14151c;
      --paper-raised:#1d1f29;
      --paper-border:#33364a;
      --muted:#9490a0;
      --accent:#ff7a5c;
      --accent-ink:#1a0e0a;
      --grass:#4fc785;
      --sky-bezel:#05060a;
      --key-bg:#242634;
      --key-border:#3d3f56;
      --key-shadow:#0b0c14;
      --shadow-soft: 0 10px 30px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --ink:#f0ece0;
    --paper:#14151c;
    --paper-raised:#1d1f29;
    --paper-border:#33364a;
    --muted:#9490a0;
    --accent:#ff7a5c;
    --accent-ink:#1a0e0a;
    --grass:#4fc785;
    --sky-bezel:#05060a;
    --key-bg:#242634;
    --key-border:#3d3f56;
    --key-shadow:#0b0c14;
    --shadow-soft: 0 10px 30px rgba(0,0,0,0.45);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    display:flex;
    justify-content:center;
    padding:32px 16px 48px;
  }
  .wrap{
    width:100%;
    max-width:1040px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }
  .masthead{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    text-align:center;
  }
  h1{
    font-family:"Press Start 2P", "IBM Plex Mono", monospace;
    font-size:clamp(20px,3.4vw,32px);
    line-height:1.4;
    margin:0;
    color:var(--ink);
    text-wrap:balance;
    letter-spacing:1px;
  }
  h1 .accent{ color:var(--accent); }
  .tagline{
    margin:0;
    color:var(--muted);
    font-size:14px;
    max-width:52ch;
  }

  .cabinet{
    position:relative;
    background:var(--sky-bezel);
    padding:14px;
    border-radius:22px;
    box-shadow:var(--shadow-soft);
    width:100%;
    max-width:984px;
  }
  .cabinet::before{
    content:"";
    position:absolute;
    inset:6px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,0.06);
    pointer-events:none;
  }
  .stage{
    position:relative;
    width:100%;
    aspect-ratio:960/540;
    border-radius:10px;
    overflow:hidden;
    background:#7ec8e3;
  }
  #game{
    display:block;
    width:100%;
    height:100%;
  }

  .overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(10,8,14,0.72);
    backdrop-filter:blur(2px);
  }
  .overlay[hidden]{ display:none; }
  .panel{
    background:var(--paper-raised);
    border:1px solid var(--paper-border);
    border-radius:14px;
    padding:28px 32px;
    max-width:420px;
    width:min(88%,420px);
    text-align:center;
    box-shadow:var(--shadow-soft);
  }
  .panel h2{
    font-family:"Press Start 2P","IBM Plex Mono",monospace;
    font-size:16px;
    margin:0 0 14px;
    color:var(--ink);
    letter-spacing:0.5px;
  }
  .panel p{
    margin:0 0 18px;
    color:var(--muted);
    font-size:14px;
    line-height:1.65;
  }
  .panel .stat{
    font-family:"Press Start 2P","IBM Plex Mono",monospace;
    color:var(--accent);
    font-size:13px;
  }
  button.playbtn{
    font-family:"Press Start 2P","IBM Plex Mono",monospace;
    font-size:13px;
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    padding:14px 22px;
    border-radius:8px;
    cursor:pointer;
    letter-spacing:0.5px;
    box-shadow:0 4px 0 rgba(0,0,0,0.25);
    transition:transform 0.08s ease;
  }
  button.playbtn:hover{ transform:translateY(-1px); }
  button.playbtn:active{ transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,0.25); }
  button.playbtn:focus-visible{ outline:3px solid var(--grass); outline-offset:2px; }

  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:14px 22px;
    justify-content:center;
    align-items:center;
  }
  .ctrl{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--muted);
    font-size:13px;
  }
  .key{
    font-family:"IBM Plex Mono",monospace;
    font-weight:600;
    font-size:12px;
    color:var(--ink);
    background:var(--key-bg);
    border:1px solid var(--key-border);
    box-shadow:0 2px 0 var(--key-shadow);
    border-radius:6px;
    padding:6px 9px;
    min-width:20px;
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    button.playbtn{ transition:none; }
  }
</style>

<div class="wrap">
  <div class="masthead">
    <h1>SLIME <span class="accent">BASH</span></h1>
    <p class="tagline">Run the ridge, clear the slimes, and plant the flag before your HP hits zero.</p>
  </div>

  <div class="cabinet">
    <div class="stage">
      <canvas id="game" width="960" height="540" tabindex="0" aria-label="Slime Bash game canvas"></canvas>
      <div class="overlay" id="overlay">
        <div class="panel">
          <h2 id="overlayTitle">SLIME BASH</h2>
          <p id="overlayText">Move with the arrow keys or A / D. Arrow Up to jump. Space to swing your blade. Three slime packs stand between you and the flag.</p>
          <button class="playbtn" id="overlayBtn">Start Game</button>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="ctrl"><span class="key">&#8592;</span><span class="key">&#8594;</span> or <span class="key">A</span><span class="key">D</span> move</div>
    <div class="ctrl"><span class="key">&#8593;</span> jump</div>
    <div class="ctrl"><span class="key">SPACE</span> attack</div>
    <div class="ctrl"><span class="key">R</span> restart</div>
  </div>
</div>

  var overlay = document.getElementById("overlay");
  var overlayTitle = document.getElementById("overlayTitle");

  var overlayBtn = document.getElementById("overlayBtn");

  // ---------- World data ----------
  var WORLD_W = 2500;
  var GROUND_Y = 470;

  function rect(x,y,w,h){ return {x:x,y:y,w:w,h:h}; }

  var groundPlatforms = [ rect(0, GROUND_Y, WORLD_W, 70) ];

  var floatPlatforms = [
    rect(260, 380, 140, 22),
    rect(470, 320, 130, 22),
    rect(700, 390, 150, 22),
    rect(950, 300, 170, 22),
    rect(1230, 370, 140, 22),
    rect(1460, 300, 150, 22),
    rect(1700, 390, 190, 22),
    rect(1990, 320, 150, 22),
    rect(2230, 400, 180, 22)
  ];

  var allPlatforms = groundPlatforms.concat(floatPlatforms);

  var flag = rect(2410, GROUND_Y - 96, 14, 96);

  function makeEnemy(spawnX, rangeLo, rangeHi, speed){
    return { x:spawnX, y:-40, w:30, h:26, vx:speed, vy:0, lo:rangeLo, hi:rangeHi,
             alive:true, hitFlash:0, squish:Math.random()*10, dead_t:0 };
  }

  var enemySpawns = [
    [340, 290, 470, 1.1],
    [760, 720, 900, 1.3],
    [1000, 970, 1130, 1.0],
    [1300, 1250, 1420, 1.2],
    [1770, 1710, 1880, 1.1],
    [2050, 2000, 2150, 1.4],
    [2260, 2230, 2400, 1.2]
  ];

  // ---------- Player ----------
  var GRAVITY = 0.62;
  var MOVE_SPEED = 4.2;
  var JUMP_V = -13.2;
  var MAX_FALL = 16;

  var player, enemies, camX, score, gameState, shake, timeAlive;

  function resetGame(){
    player = {
      x: 60, y: GROUND_Y - 46, w: 30, h: 46, vx:0, vy:0,
      facing: 1, onGround:false, hp: 4, maxHp:4,
      invuln:0, attackT:0, attackCd:0, walkCycle:0
    };
    enemies = enemySpawns.map(function(e){ return makeEnemy(e[0],e[1],e[2],e[3]); });
    camX = 0;
    score = 0;
    shake = 0;
    timeAlive = 0;
    gameState = "playing";
  }

  // ---------- Input ----------
  var keys = {};
  var WATCHED = ["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space","KeyA","KeyD","KeyR"];

  window.addEventListener("keydown", function(e){
    if (WATCHED.indexOf(e.code) !== -1) e.preventDefault();
    keys[e.code] = true;
    if (e.code === "KeyR" && (gameState === "gameover" || gameState === "win")) {
      startGame();
    }
    if (gameState === "start" && (e.code === "ArrowUp" || e.code === "Enter")) {
      startGame();
    }
  });
  window.addEventListener("keyup", function(e){
    keys[e.code] = false;
  });
  canvas.addEventListener("mousedown", function(){ canvas.focus(); });

  function startGame(){
    resetGame();
    overlay.hidden = true;
    canvas.focus();
  }
  overlayBtn.addEventListener("click", startGame);
  gameState = "start";

  // ---------- Collision ----------
  function intersects(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }

  function moveAndCollide(e, platforms){
    e.x += e.vx;
    for (var i=0;i<platforms.length;i++){
      var p = platforms[i];
      if (intersects(e,p)){
        if (e.vx > 0) e.x = p.x - e.w;
        else if (e.vx < 0) e.x = p.x + p.w;
      }
    }
    e.y += e.vy;
    e.onGround = false;
    for (var j=0;j<platforms.length;j++){
      var p2 = platforms[j];
      if (intersects(e,p2)){
        if (e.vy > 0){ e.y = p2.y - e.h; e.vy = 0; e.onGround = true; }
        else if (e.vy < 0){ e.y = p2.y + p2.h; e.vy = 0; }
      }
    }
  }

  // ---------- Update ----------
  function update(dt){
    if (gameState !== "playing") return;
    timeAlive += dt;

    var left = keys.ArrowLeft || keys.KeyA;
    var right = keys.ArrowRight || keys.KeyD;

    if (left && !right){ player.vx = -MOVE_SPEED; player.facing = -1; }
    else if (right && !left){ player.vx = MOVE_SPEED; player.facing = 1; }
    else player.vx = 0;

    if (keys.ArrowUp && player.onGround){
      player.vy = JUMP_V;
      player.onGround = false;
    }

    player.vy += GRAVITY * dt;
    if (player.vy > MAX_FALL) player.vy = MAX_FALL;

    if (player.vx !== 0) player.walkCycle += 0.25 * dt; else player.walkCycle = 0;

    moveAndCollide(player, allPlatforms);
    if (player.x < 0) player.x = 0;
    if (player.x + player.w > WORLD_W) player.x = WORLD_W - player.w;

    if (player.attackCd > 0) player.attackCd -= dt;
    if (player.attackT > 0) player.attackT -= dt;
    if (keys.Space && player.attackCd <= 0){
      player.attackT = 14;
      player.attackCd = 26;
    }
    if (player.invuln > 0) player.invuln -= dt;
    if (shake > 0) shake -= dt;

    var hitbox = null;
    if (player.attackT > 8){
      var reach = 30;
      hitbox = player.facing === 1
        ? rect(player.x + player.w, player.y + 6, reach, player.h - 12)
        : rect(player.x - reach, player.y + 6, reach, player.h - 12);
    }

    for (var i=0;i<enemies.length;i++){
      var en = enemies[i];
      if (!en.alive){
        en.dead_t += dt;
        continue;
      }
      en.squish += 0.15 * dt;
      if (en.x <= en.lo) en.vx = Math.abs(en.vx);
      if (en.x + en.w >= en.hi) en.vx = -Math.abs(en.vx);
      en.vy += GRAVITY * dt;
      if (en.vy > MAX_FALL) en.vy = MAX_FALL;
      moveAndCollide(en, allPlatforms);

      if (en.hitFlash > 0) en.hitFlash -= dt;

      if (hitbox && intersects(hitbox, en)){
        en.alive = false;
        en.hitFlash = 10;
        score += 1;
        shake = 8;
      } else if (player.invuln <= 0 && intersects(player, en)){
        player.hp -= 1;
        player.invuln = 65;
        shake = 10;
        player.vx = (player.x < en.x ? -1 : 1) * 3;
        player.vy = -6;
        if (player.hp <= 0){
          player.hp = 0;
          gameState = "gameover";
          showOverlay("YOU DIED", "The slimes got the better of you. Score: " + score + " · Time: " + Math.floor(timeAlive/60) + "s", "Try Again");
        }
      }
    }

    if (gameState === "playing" && intersects(player, flag)){
      gameState = "win";
      var lifePct = Math.round((player.hp / player.maxHp) * 100);
      showOverlay("FLAG CAPTURED!", "You cleared the ridge with " + score + " slime" + (score===1?"":"s") + " defeated and " + lifePct + "% of your flask still full.", "Play Again");
    }

    var targetCam = player.x + player.w/2 - VW/2;
    targetCam = Math.max(0, Math.min(WORLD_W - VW, targetCam));
    camX += (targetCam - camX) * Math.min(1, 0.18*dt);
  }

  function showOverlay(title, text, btnLabel){
    overlayTitle.textContent = title;
    overlayText.textContent = text;
    overlayBtn.textContent = btnLabel;
    overlay.hidden = false;
  }

  // ---------- Render ----------
  function drawBackground(){
    if (!bgReady){
      // fallback while the artwork loads
      var g = ctx.createLinearGradient(0,0,0,VH);
      g.addColorStop(0, "#171326");
      g.addColorStop(1, "#2c2338");
      ctx.fillStyle = g;
      ctx.fillRect(0,0,VW,VH);
      return;
    }
    var maxShift = Math.max(0, bgDrawW - VW);
    var camPct = WORLD_W - VW > 0 ? camX / (WORLD_W - VW) : 0;
    var shiftX = -camPct * maxShift;
    var shiftY = -(bgDrawH - VH) / 2;
    ctx.drawImage(bgImg, shiftX, shiftY, bgDrawW, bgDrawH);

    // gentle depth vignette so platforms & sprites stay legible over the art
    var vg = ctx.createLinearGradient(0, VH*0.45, 0, VH);
    vg.addColorStop(0, "rgba(8,6,16,0)");
    vg.addColorStop(1, "rgba(8,6,16,0.55)");
    ctx.fillStyle = vg;
    ctx.fillRect(0,0,VW,VH);
  }

  function drawPlatform(p){
    var sx = p.x - camX;
    if (sx + p.w < 0 || sx > VW) return;
    ctx.fillStyle = "#6b4a34";
    ctx.fillRect(sx, p.y, p.w, p.h);
    ctx.fillStyle = "#3aa66b";
    ctx.fillRect(sx, p.y, p.w, 8);
    ctx.fillStyle = "rgba(255,255,255,0.12)";
    for (var i=0;i<p.w;i+=14){
      ctx.fillRect(sx+i, p.y+8, 6, 3);
    }
  }

  function drawFlag(){
    var sx = flag.x - camX;
    ctx.fillStyle = "#3d2a1e";
    ctx.fillRect(sx+5, flag.y, 4, flag.h);
    var wave = Math.sin(timeAlive*0.08) * 4;
    ctx.fillStyle = "#e8543e";
    ctx.beginPath();
    ctx.moveTo(sx+9, flag.y+6);
    ctx.lineTo(sx+42+wave, flag.y+16);
    ctx.lineTo(sx+9, flag.y+30);
    ctx.closePath();
    ctx.fill();
  }

  function drawEnemy(en){
    if (en.dead_t > 18) return;
    var sx = en.x - camX;
    if (sx + en.w < -20 || sx > VW+20) return;
    ctx.save();
    var cx = sx + en.w/2, cy = en.y + en.h;
    var squish = en.alive ? (Math.sin(en.squish)*0.08) : 0;
    var fade = en.alive ? 1 : Math.max(0, 1 - en.dead_t/18);
    ctx.globalAlpha = fade;
    ctx.translate(cx, cy);
    ctx.scale(1+squish, 1-squish);
    ctx.fillStyle = en.hitFlash > 0 ? "#ffffff" : (en.alive ? "#8a5cf6" : "#5b3fa0");
    ctx.beginPath();
    ctx.ellipse(0, -en.h/2, en.w/2, en.h/2, 0, 0, Math.PI*2);
    ctx.fill();
    if (en.alive){
      ctx.fillStyle = "#1b1f2a";
      ctx.beginPath();
      ctx.arc(-6, -en.h/2-2, 2.6, 0, Math.PI*2);
      ctx.arc(6, -en.h/2-2, 2.6, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawPlayer(){
    var sx = player.x - camX;
    var blink = player.invuln > 0 && Math.floor(player.invuln/4) % 2 === 0;
    ctx.save();
    ctx.globalAlpha = blink ? 0.4 : 1;
    ctx.translate(sx, player.y);

    var bob = player.onGround && player.vx !== 0 ? Math.sin(player.walkCycle)*2 : 0;

    // legs
    ctx.fillStyle = "#2c3550";
    ctx.fillRect(6, 34+bob, 7, 12);
    ctx.fillRect(17, 34-bob, 7, 12);

    // torso
    ctx.fillStyle = "#3f6fd1";
    ctx.fillRect(4, 12, player.w-8, 24);

    // belt
    ctx.fillStyle = "#e8b23d";
    ctx.fillRect(4, 30, player.w-8, 4);

    // head
    ctx.fillStyle = "#f0c49a";
    ctx.fillRect(6, 0, player.w-12, 14);

    // eye (facing direction)
    ctx.fillStyle = "#1b1f2a";
    var eyeX = player.facing === 1 ? player.w-13 : 5;
    ctx.fillRect(eyeX, 5, 3, 3);

    // sword arm / swing
    ctx.fillStyle = "#d8d3c8";
    if (player.attackT > 0){
      var swing = 1 - Math.abs(player.attackT-7)/7;
      var reach = 16 + swing*14;
      if (player.facing === 1){
        ctx.fillRect(player.w-6, 14, reach, 5);
        ctx.fillStyle = "#e8543e";
        ctx.fillRect(player.w-6+reach-4, 10, 4, 13);
      } else {
        ctx.fillRect(-reach+6, 14, reach, 5);
        ctx.fillStyle = "#e8543e";
        ctx.fillRect(-reach+6, 10, 4, 13);
      }
    } else {
      var armX = player.facing === 1 ? player.w-8 : 2;
      ctx.fillRect(armX, 16, 6, 14);
    }

    ctx.restore();
  }

  function drawHUD(){
    drawLifeFlask();

    // score
    var label = "SLIMES  " + score;
    ctx.font = "bold 13px 'IBM Plex Mono', monospace";
    var tw = ctx.measureText(label).width;
    ctx.fillStyle = "rgba(10,8,14,0.55)";
    roundRect(VW-tw-40, 14, tw+28, 30, 8);
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.fillText(label, VW-tw-26, 30);
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawLifeFlask(){
    var backX = 16, backY = 10, dispH = 138, padX = 16, padTop = 8, padBottom = 20;
    var level = Math.max(0, Math.min(4, Math.round(player.hp)));
    var img = FLASK_IMAGES[level];

    if (img && img.ready){
      var dispW = dispH * (img.naturalWidth / img.naturalHeight);
      ctx.fillStyle = "rgba(10,8,14,0.5)";
      roundRect(backX, backY, dispW + padX*2, dispH + padTop + padBottom, 12);
      ctx.fill();

      var shake2 = player.invuln > 0 && Math.floor(player.invuln/4)%2===0 ? 3 : 0;
      ctx.drawImage(img, backX + padX + shake2, backY + padTop, dispW, dispH);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 12px 'IBM Plex Mono', monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      ctx.fillText(level + " / 4", backX + padX + dispW/2, backY + padTop + dispH + 15);
      ctx.textAlign = "left";
    } else {
      // simple fallback bar while the flask art decodes
      var barX = 20, barY = 18, barW = 180, barH = 20;
      ctx.fillStyle = "rgba(10,8,14,0.55)";
      roundRect(barX-6, barY-6, barW+12, barH+12, 8);
      ctx.fill();
      ctx.fillStyle = "#241b1b";
      roundRect(barX, barY, barW, barH, 5);
      ctx.fill();
      var pct = Math.max(0, player.hp / player.maxHp);
      ctx.fillStyle = "#c9382a";
      roundRect(barX+2, barY+2, Math.max(0,(barW-4)*pct), barH-4, 4);
      ctx.fill();
    }
  }

  function render(){
    ctx.save();
    var sx = 0, sy = 0;
    if (shake > 0){
      sx = (Math.random()-0.5) * shake * 0.6;
      sy = (Math.random()-0.5) * shake * 0.6;
    }
    ctx.translate(sx, sy);

    drawBackground();

    ctx.save();
    allPlatforms.forEach(drawPlatform);
    drawFlag();
    enemies.forEach(drawEnemy);
    if (gameState !== "start") drawPlayer();
    ctx.restore();

    ctx.restore();

    if (gameState === "playing" || gameState === "win" || gameState === "gameover"){
      drawHUD();
    }
  }

  // ---------- Loop ----------
  var lastTime = null;
  function frame(ts){
    if (lastTime === null) lastTime = ts;
    var dtMs = ts - lastTime;
    lastTime = ts;
    var dt = Math.min(2.5, dtMs / 16.6667);

    update(dt);
    render();

    requestAnimationFrame(frame);
  }

  resetGame();
  gameState = "start";
  render();
  requestAnimationFrame(frame);
})();
</script>
